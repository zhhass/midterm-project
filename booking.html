<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book now | Brass &amp; Blade Barbershop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Brass &amp; Blade</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="services.html">Services</a></li><li class="nav-item"><a class="nav-link" href="barbers.html">Barbers</a></li><li class="nav-item"><a class="nav-link active" href="booking.html">Book now</a></li><li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li><li class="nav-item"><a class="nav-link" href="mybookings.html">My bookings <span class="badge bg-danger" id="booking-badge">0</span></a></li></ul>
          <button id="theme-toggle" class="btn btn-outline-light btn-sm ms-lg-3" type="button">Dark mode</button></div>
      </div>
    </nav>
  </header>
  <main>
    <section class="page-title"><div class="container"><h1>Book your chair</h1><p>Fill in the form and we will confirm by phone.</p></div></section>
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7">
            <div id="booking-success" class="alert alert-success" role="alert" hidden></div>
            <form id="booking-form" action="#" method="post" novalidate>
              <div class="mb-3"><label for="name" class="form-label">Full name</label><input type="text" class="form-control" id="name" name="name" required><div class="invalid-feedback"></div></div>
              <div class="mb-3"><label for="phone" class="form-label">Phone number</label><input type="tel" class="form-control" id="phone" name="phone" required><div class="invalid-feedback"></div></div>
              <div class="row g-3 mb-3">
                <div class="col-sm-6"><label for="service" class="form-label">Service</label>
                  <select class="form-select" id="service" name="service"></select><div class="invalid-feedback"></div></div>
                <div class="col-sm-6"><label for="barber" class="form-label">Barber</label>
                  <select class="form-select" id="barber" name="barber"></select></div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-sm-6"><label for="date" class="form-label">Date</label><input type="date" class="form-control" id="date" name="date" required><div class="invalid-feedback"></div></div>
                <div class="col-sm-6"><label for="time" class="form-label">Time</label><input type="time" class="form-control" id="time" name="time" min="10:00" max="20:00" required><div class="invalid-feedback"></div></div>
              </div>
              <p id="price-summary" class="fw-semibold"></p>
              <div class="mb-3"><label for="notes" class="form-label">Notes (optional)</label><textarea class="form-control" id="notes" name="notes" rows="3"></textarea></div>
              <button type="submit" class="btn btn-brass w-100">Request booking</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="text-center py-4">
    <div class="container">
      <p class="mb-1">Brass &amp; Blade Barbershop &middot; Astana</p>
      <p class="mb-0 small">Open Mon&ndash;Sat, 10:00&ndash;21:00</p>
    </div>
  </footer>
  <button id="back-top" type="button" aria-label="Back to top">&uarr;</button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/models.js"></script>
  <script src="js/api.js"></script>
  <script src="js/final.js"></script>
  <script src="js/jq.js"></script>
</body>
</html>
